standalone: true
verbosity: INFO
from: markdown+alerts
to: typst
metadata-file: typst-includes.yaml
template: custom.typst
wrap: preserve
pdf-engine-opt: '--pdf-standard=a-2b'
filters:
  - assimilateMetadata.rb # assimilate metadata from YAML to Pandoc templates
  - typstFix.lua # move labels
  - pagebreak.lua # page breaks
  #- removeDimensions.lua
  - convertIndex.lua # indexing
  - list-table.lua # list tables
  - abstract-section.lua # move abstract to metadata
  - pretty-urls.lua # clean link text
  - alerts.lua # alert boxes
table-of-contents: true
metadata:
  nonumberfigures: true
