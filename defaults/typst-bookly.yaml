# yaml-language-server: $schema=none
standalone: true
from: markdown
to: typst-citations
metadata-file: typst-plain.yaml
verbosity: INFO
template: bookly.typst
filters:
  - include-files.lua # include files
  - typstFix.lua # move labels
  - querverweis.lua # cross-refs
  - convertIndex.lua # indexing
  - citeproc # refs
  - mermaid.lua # mermaid diagrams
  - alerts.lua # alerts
  - list-table.lua # list tables
  - pagebreak.lua # page breaks
  - abstract-section.lua # move abstract to metadata
  - pretty-urls.lua # clean link text
table-of-contents: true
cite-method: citeproc
bibliography: ${USERDATA}/CoreFast.json #JSON faster than BIB, symlinked into Pandoc data dir
csl: ${USERDATA}/csl/cell-doi.csl
citation-abbreviations: ${USERDATA}/cite-abbr.json # my journal abbreviations
metadata:
  doindex: true
  reference-section-title: Bibliography
  notes-after-punctuation: true
  link-citations: true
  link-bibliography: true
  section-numbering: "1.1.1"
